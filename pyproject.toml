[project]
name = "real-estate-mcp"
version = "0.1.0"
description = "FastMCP server exposing real-estate market-intelligence tools over MCP for agent deployment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<4",
    "langfuse>=4.14.4,<5",
    "supabase>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
real-estate-mcp = "app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
